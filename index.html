<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>.ممد تبهکار</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #090909;
      color: #f5f5f5;
      font-family: Tahoma, Arial, sans-serif;
      padding: 24px;
    }
    .card {
      width: min(430px, 100%);
      background: #151515;
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 18px 60px rgba(0,0,0,.55);
      text-align: center;
    }
    .cover {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 16px;
      display: block;
      margin-bottom: 20px;
    }
    h1 { margin: 0 0 7px; font-size: 25px; }
    p { margin: 0 0 20px; color: #bdbdbd; font-size: 15px; }
    audio { width: 100%; }
    .download {
      display: inline-block;
      margin-top: 18px;
      color: #fff;
      text-decoration: none;
      border: 1px solid #444;
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 14px;
    }
    .download:hover { background: #222; }
  </style>
</head>
<body>
  <main class="card">
    <img class="cover" src="cover.jpg" alt="کاور آهنگ">
    <h1>تباهکار</h1>
    <p>داریوش</p>
    <audio controls preload="metadata">
      <source src="song.mp3" type="audio/mpeg">
      مرورگر شما از پخش فایل صوتی پشتیبانی نمی‌کند.
    </audio>
    <a class="download" href="song.mp3" download>دانلود آهنگ</a>
  </main>
</body>
</html>
